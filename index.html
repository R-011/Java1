
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Java 1</title>
</head>
<body>
    <label>Numri pare</label>
    <input type="number" id="nr1">
    <br>

    <label>Numri dyte</label>
    <input type="number" id="nr2">
    <br><br>

    <button type="button" onclick="sum()">Shuma</button>
    <button type="button" onclick="zbritje()">Zbritje</button>
    <button type="button" onclick="shumezimi()">Shumezimi</button>
    <button type="button" onclick="pjestim()">Pjesetimi</button>

    <p id="result"></p>

    <br>
    <br>
    <h1> Rritje/ zbritje te numrit </h1>

    <p id="numri">0</p>
    <button type="submit" onclick="rritje()"> Rritje +</button>
     <button type="submit" onclick="zbritje()"> Zbritje -</button>

    <script>

        var n=0;
        function rritje()
        {
            n=n+1;
            document.getElementById('numri').innerHTML = n;
        }

        function zbritje()
        {
             n=n-1;
            document.getElementById('numri').innerHTML = n;

        }


        
        function sum() {
            var a = Number(document.getElementById('nr1').value);
            var b = Number(document.getElementById('nr2').value);
            var c = a + b;

            document.getElementById('result').innerHTML = c;
        }

        function zbritje() {
            var a = Number(document.getElementById('nr1').value);
            var b = Number(document.getElementById('nr2').value);
            var c = a - b;

            document.getElementById('result').innerHTML = c;
        }

        function shumezimi() {
            var a = Number(document.getElementById('nr1').value);
            var b = Number(document.getElementById('nr2').value);
            var c = a * b;

            document.getElementById('result').innerHTML = c;
        }

        function pjestim() {
            var a = Number(document.getElementById('nr1').value);
            var b = Number(document.getElementById('nr2').value);

            if (b == 0) {
                document.getElementById('result').innerHTML =
                    'Nuk pjestohet me 0';
            } else {
                var c = a / b;
                document.getElementById('result').innerHTML = c;
            }
        }
    </script>
</body>
</html>
